{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2>✏️ Редактирование тарифа</h2>
    <a href="/tariffs" class="btn btn-secondary">🔙 Назад</a>
</div>

<div class="card">
    <div class="card-header">
        ✏️ {{ tariff[1] }}
    </div>
    <div class="card-body">
        <form method="POST" action="/tariffs/edit/{{ tariff[0] }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">📛 Название тарифа</label>
                <input type="text" name="name" class="form-control form-control-lg" 
                       value="{{ tariff[1] }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">💰 Цена (₽)</label>
                <input type="number" name="price_rub" class="form-control form-control-lg" 
                       value="{{ tariff[2] }}" step="0.01" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">📅 Дней</label>
                <input type="number" name="duration_days" class="form-control form-control-lg" 
                       value="{{ tariff[3] }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">📦 Трафик (ГБ, 0 = ∞)</label>
                <input type="number" name="traffic_gb" class="form-control form-control-lg" 
                       value="{{ tariff[4] }}" step="0.1">
                <div class="text-muted small">0 означает безлимитный трафик</div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">📱 Лимит IP</label>
                <input type="number" name="ip_limit" class="form-control form-control-lg" 
                       value="{{ tariff[5] }}">
                <div class="text-muted small">Количество устройств одновременно</div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" name="is_active" class="form-check-input" id="is_active"
                       {% if tariff[6] %}checked{% endif %}>
                <label class="form-check-label fw-semibold" for="is_active">
                    ✅ Тариф активен
                </label>
                <div class="text-muted small">Если выключить — тариф не будет отображаться пользователям</div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary btn-lg px-5">💾 Сохранить изменения</button>
                <a href="/tariffs" class="btn btn-secondary btn-lg px-4">🔙 Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
