{% extends "base.html" %}
{% block content %}
<div class="page-header"><h2>📨 Рассылка</h2></div>
<div class="card"><div class="card-header">📝 Создать рассылку</div><div class="card-body">
    <form method="POST" action="/broadcast/send">
        <div class="mb-3"><label class="form-label">Текст сообщения</label><textarea name="message" class="form-control" rows="4" required></textarea></div>
        <div class="mb-3"><label class="form-label">Кому отправить</label>
            <select name="filter" class="form-select"><option value="all">Все пользователи</option><option value="active">С активной подпиской</option><option value="expired">С истекшей подпиской</option><option value="never_bought">Никогда не покупали</option></select>
        </div>
        <div class="mb-3"><label class="form-label">Отложить отправку</label><input type="datetime-local" name="schedule" class="form-control"></div>
        <button type="submit" class="btn btn-primary">📤 Отправить</button>
    </form>
</div></div>
<div class="card"><div class="card-header">📋 История рассылок</div><div class="card-body p-0">
    <div class="table-responsive"><table class="table table-striped table-hover">
        <thead><tr><th>ID</th><th>Текст</th><th>Фильтр</th><th>Отправлено</th><th>Статус</th></tr></thead>
        <tbody>{% for b in broadcasts %}<tr>
            <td>{{ b[0] }}</td><td>{{ b[1][:50] }}...</td><td>{{ b[2] }}</td><td>{{ b[7] }}</td>
            <td>{% if b[5] == 'sent' %}✅ Отправлено{% else %}⏳ В очереди{% endif %}</td>
        </tr>{% endfor %}</tbody>
    </table></div>
</div></div>
{% endblock %}
