<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card-bg: rgba(255,255,255,0.92);
            --card-border: rgba(255,255,255,0.6);
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent: #007AFF;
            --accent-hover: #0066D9;
            --input-bg: rgba(255,255,255,0.8);
            --input-border: #e5e5ea;
            --input-focus: rgba(0,122,255,0.12);
            --glow-color: rgba(0,122,255,0.08);
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card-bg: rgba(28,28,30,0.92);
                --card-border: rgba(255,255,255,0.08);
                --text-primary: #f2f2f7;
                --text-secondary: #8e8e93;
                --accent: #0A84FF;
                --accent-hover: #0066D9;
                --input-bg: rgba(28,28,30,0.8);
                --input-border: #38383a;
                --input-focus: rgba(10,132,255,0.2);
                --glow-color: rgba(10,132,255,0.08);
                --shadow: 0 20px 60px rgba(0,0,0,0.4);
            }
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg); min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 2rem; color: var(--text-primary);
        }
        .glow-bg {
            position: fixed; top:0; left:0; width:100%; height:100%;
            pointer-events: none; z-index:0;
        }
        .glow-bg::before {
            content: ''; position: absolute;
            width: 80%; height: 80%; top: -20%; left: -20%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            filter: blur(80px);
        }
        .card {
            position: relative; z-index:2;
            max-width: 440px; width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 44px;
            border: 1px solid var(--card-border);
            padding: 3rem 2rem;
            box-shadow: var(--shadow);
        }
        h1 { text-align:center; font-size:1.5rem; font-weight:700; margin-bottom:0.5rem; }
        .sub { text-align:center; color:var(--text-secondary); font-size:0.9rem; margin-bottom:2rem; }
        .field label { display:block; color:var(--text-secondary); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.4rem; }
        .field input {
            width:100%; padding:0.9rem 1.2rem; border-radius:14px;
            border:2px solid var(--input-border); background:var(--input-bg);
            color:var(--text-primary); font-size:1rem; outline:none;
            font-family:inherit; margin-bottom:1.5rem;
        }
        .field input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--input-focus); }
        .btn {
            width:100%; padding:0.9rem; border-radius:14px; border:none;
            background:var(--accent); color:#fff; font-size:1rem;
            font-weight:600; cursor:pointer; font-family:inherit;
            box-shadow:0 4px 16px rgba(0,122,255,0.3);
        }
        .btn:hover { background:var(--accent-hover); transform:translateY(-2px); }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="card">
        <h1>Новый пароль</h1>
        <div class="sub">Обязательно смените пароль при первом входе</div>
        <form method="post" action="/change-password">
            <div class="field">
                <label>Новый пароль</label>
                <input type="password" name="new_password" placeholder="Минимум 6 символов" required minlength="6">
            </div>
            <button type="submit" class="btn">Сохранить</button>
        </form>
    </div>
</body>
</html>
